<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" width="22" height="22" alt="" />
      <strong data-i18n="extName"></strong>
      <span id="status" class="status"></span>
    </header>
    <section id="offline" class="callout" hidden></section>
    <label class="toggle">
      <input type="checkbox" id="enabled" />
      <span class="track"><span class="thumb"></span></span>
      <span data-i18n="interceptToggle"></span>
    </label>
    <h3 data-i18n="detectedMedia"></h3>
    <ul id="media"></ul>
    <p id="nomedia" class="muted" data-i18n="noMedia" hidden></p>
    <footer>
      <button id="all" data-i18n="downloadAllLinks"></button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
