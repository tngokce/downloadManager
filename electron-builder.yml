# Tek kod tabanından Windows ve macOS paketleri üretir.
#   npm run dist:mac  -> release/*.dmg, *.zip (Apple Silicon + Intel)
#   npm run dist:win  -> release/*-Setup.exe (kurulum) ve *-Portable.exe
appId: com.tngokce.downloadmanager
productName: Gökçe Download Manager
# İndirilen paket dosyalarının adları Türkçe karakter içermesin diye artifactName'ler ASCII tutulur.
copyright: Copyright © 2026 Tunahan Gökçe
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: extension
    to: extension
  - from: resources
    to: resources
    filter: ['*.png']
asar: true
protocols:
  - name: Gökçe Download Manager
    schemes: [dlmanager]

mac:
  # NOT: macOS'ta uygulama paketinin (.app) adında Türkçe karakter olursa Electron açılışta çöker.
  # Bu yüzden Mac paketleri `npm run dist:mac` ile ASCII adla (Gokce Download Manager.app) derlenir;
  # menü çubuğunda, Dock'ta ve uygulama içinde görünen ad yine "Gökçe Download Manager" olur.
  category: public.app-category.utilities
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Gokce-Download-Manager-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # İmza sertifikası varsa CSC_LINK / CSC_KEY_PASSWORD ortam değişkenleriyle otomatik imzalanır.
dmg:
  title: ${productName} ${version}
  window:
    width: 540
    height: 380

win:
  icon: resources/icon.png
  executableName: gokce-download-manager
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gökçe Download Manager
  artifactName: Gokce-Download-Manager-${version}-Setup-${arch}.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: Gokce-Download-Manager-${version}-Portable.${ext}

linux:
  icon: resources/icon.png
  maintainer: Tunahan Gökçe (https://github.com/tngokce)
  executableName: gokce-download-manager
  category: Network
  target: [AppImage, deb]
