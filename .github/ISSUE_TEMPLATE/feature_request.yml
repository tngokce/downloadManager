name: 💡 Özellik isteği / Feature request
description: Yeni bir özellik veya iyileştirme önerin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor? / What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Nasıl çalışmasını istersiniz? / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Düşündüğünüz alternatifler / Alternatives considered
