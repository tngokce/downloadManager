name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Varsayılan olarak yalnızca okuma izni; yalnızca release işi yazma izni alır.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Paketle
        shell: bash
        run: |
          # Sertifika secret'ı yoksa değişkenler boş kalır; boş CSC_LINK electron-builder'ı bozduğu için kaldırılır.
          if [ "$HAS_CERT" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # Sertifika yoksa macOS paketi ad-hoc imzalanır; aksi halde Apple Silicon'da "hasarlı" uyarısı çıkar.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ "$HAS_CERT" = "true" ]; then
              npm run dist:mac -- --publish never
            else
              npm run dist:mac -- --publish never -c.mac.identity=-
            fi
          else
            npm run dist:win -- --publish never
          fi
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
          # İmzalama sertifikaları isteğe bağlıdır (repo secrets). Yoksa imzasız paket üretilir.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - name: Eklentiyi paketle
        if: matrix.os == 'macos-latest'
        run: npm run extension
      - uses: actions/upload-artifact@v4
        with:
          name: gokce-download-manager-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            extension-dist/*.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
